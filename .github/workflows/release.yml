name: Release

# Push a tag like `v0.0.1` to build native `mq` binaries for macOS (arm64)
# and Linux (x86_64) and attach them to a GitHub Release.
#
# Distributing a Mere *app* is more involved than a normal binary: the
# build needs the Mere toolchain (`mere` + `mere install` for deps) and a C
# compiler. CI installs a prebuilt `mere` from its GitHub Release (no OCaml
# toolchain), then `mere install` fetches deps and `mere -c | clang`
# produces the native binary. (Requires a `mere` release that includes the
# fixes this app depends on — v0.1.1+.)

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Create (or reuse) the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRE=""
          case "${GITHUB_REF_NAME}" in *-*) PRE="--prerelease" ;; esac
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes $PRE || true

  binaries:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: mq-linux-x86_64
          - os: macos-latest
            asset: mq-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install the Mere compiler
        run: |
          curl -fsSL https://raw.githubusercontent.com/merelang/mere/main/scripts/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install app dependencies
        run: mere install

      - name: Compile to a native binary
        run: |
          mkdir -p dist
          mere -c main.mere > mq.c
          clang -O2 mq.c -o "dist/${{ matrix.asset }}"

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            "dist/${{ matrix.asset }}" --clobber
