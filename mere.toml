[package]
name = "mq"
version = "0.0.3"

# mq compiles to a NATIVE binary via the C backend (mere -c | clang) —
# no Node host, unlike the mere-notes web app. So no [host] section.
[dependencies]
json = { git = "https://github.com/merelang/mere", subdir = "contrib/json", rev = "v0.1.3" }
csv  = { git = "https://github.com/merelang/mere", subdir = "contrib/csv",  rev = "v0.1.3" }
